<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tally</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0d0d0d;
    --panel:#1c1c1c;
    --paper:#f5f5f5;
    --amber:#f5f5f5;
    --amber-dim:#c4c4c4;
    --muted:#8a8a8a;
    --line:#333333;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* Header / tally */
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }
  .tally-row{
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .tally-count{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:76px;
    line-height:0.85;
    color:var(--paper);
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
  }
  .tally-label{
    font-size:13px;
    color:var(--muted);
    padding-bottom:6px;
  }
  .today-strip{
    margin-top:10px;
    font-size:13px;
    color:var(--amber);
    font-weight:500;
  }

  /* Camera */
  .camera-wrap{
    padding:18px 20px 22px;
    border-bottom:1px solid var(--line);
  }
  .camera-frame{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:var(--panel);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .camera-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .camera-frame.has-photo img{ display:block; }
  .camera-frame::before{
    content:'No photo yet';
    color:var(--muted);
    font-size:13px;
  }
  .camera-frame.has-photo::before{ content:none; }
  .camera-error{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:13px;
    line-height:1.5;
    color:var(--paper);
    background:var(--panel);
    z-index:2;
  }
  .camera-controls, .review-controls{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:16px;
  }
  .review-controls{ display:none; gap:16px; }
  .shutter-btn{
    width:74px;
    height:74px;
    border-radius:50%;
    background:var(--amber);
    border:4px solid #000000;
    outline:2px solid var(--amber-dim);
    outline-offset:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .shutter-btn:active{
    transform:scale(0.92);
    background:var(--amber-dim);
  }
  .shutter-btn svg{ width:28px; height:28px; }
  .review-btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:13px 26px;
    border-radius:24px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
  }
  .review-btn.save{
    background:var(--amber);
    border-color:var(--amber);
    color:#0d0d0d;
  }
  .review-btn.trash{
    color:#f5f5f5;
    border-color:#4a4a4a;
  }
  .shutter-hint{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
  }

  /* Archive */
  .archive{
    flex:1;
    padding:20px 16px 40px;
  }
  .archive-title{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 14px;
    padding:0 4px;
  }
  .day-group{ margin-bottom:22px; }
  .day-label{
    font-size:13px;
    color:var(--amber);
    font-weight:600;
    margin:0 4px 8px;
    display:flex;
    justify-content:space-between;
  }
  .day-label .count{ color:var(--muted); font-weight:400; }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
  }
  .thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:6px;
    overflow:hidden;
    background:var(--panel);
    cursor:pointer;
  }
  .thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .thumb time{
    position:absolute;
    bottom:0; left:0; right:0;
    font-size:10px;
    color:var(--paper);
    background:linear-gradient(transparent, rgba(0,0,0,0.65));
    padding:10px 6px 4px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }

  /* Viewer overlay */
  .viewer{
    position:fixed; inset:0;
    background:rgba(10,9,7,0.96);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:50;
    padding:20px;
  }
  .viewer.open{ display:flex; }
  .viewer img{
    max-width:100%;
    max-height:70vh;
    border-radius:8px;
    object-fit:contain;
  }
  .viewer-meta{
    margin-top:16px;
    color:var(--paper);
    font-size:14px;
    text-align:center;
  }
  .viewer-meta .sub{ color:var(--muted); font-size:12px; margin-top:2px;}
  .viewer-actions{
    margin-top:20px;
    display:flex;
    gap:12px;
  }
  .viewer-actions button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:10px 18px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
  }
  .viewer-actions button.danger{
    color:#f5f5f5;
    border-color:#4a4a4a;
  }

  .loading{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px;
  }
</style>
</head>
<body>

  <header>
    <p class="eyebrow">Running Total</p>
    <div class="tally-row">
      <div class="tally-count" id="tally-count">0</div>
      <div class="tally-label">logged</div>
    </div>
    <div class="today-strip" id="today-strip"></div>
  </header>

  <div class="camera-wrap">
    <div class="camera-frame">
      <img id="captured-preview" alt="Captured photo">
      <div class="camera-error" id="camera-error"></div>
    </div>
    <canvas id="resize-canvas" style="display:none;"></canvas>

    <div class="camera-controls" id="live-controls">
      <label class="shutter-btn" for="camera-input" aria-label="Take photo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8C4 6.89543 4.89543 6 6 6H7.5L8.5 4.5H15.5L16.5 6H18C19.1046 6 20 6.89543 20 8V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V8Z" stroke="#0d0d0d" stroke-width="1.6"/>
          <circle cx="12" cy="12.5" r="3.4" stroke="#0d0d0d" stroke-width="1.6"/>
        </svg>
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
    </div>

    <div class="review-controls" id="review-controls">
      <button class="review-btn trash" id="trash-btn">Trash</button>
      <button class="review-btn save" id="save-btn">Upload</button>
    </div>

    <p class="shutter-hint" id="shutter-hint">Tap to open the camera</p>
  </div>


  <div class="archive">
    <p class="archive-title">Archive</p>
    <div id="archive-body">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <img id="viewer-img" src="" alt="Logged entry">
    <div class="viewer-meta">
      <div id="viewer-date"></div>
      <div class="sub" id="viewer-time"></div>
    </div>
    <div class="viewer-actions">
      <button id="viewer-close">Close</button>
      <button class="danger" id="viewer-delete">Delete</button>
    </div>
  </div>

<script>
(function(){
  const cameraFrame = document.querySelector('.camera-frame');
  const capturedPreview = document.getElementById('captured-preview');
  const cameraInput = document.getElementById('camera-input');
  const resizeCanvas = document.getElementById('resize-canvas');
  const cameraError = document.getElementById('camera-error');
  const liveControls = document.getElementById('live-controls');
  const reviewControls = document.getElementById('review-controls');
  const trashBtn = document.getElementById('trash-btn');
  const saveBtn = document.getElementById('save-btn');
  const shutterHint = document.getElementById('shutter-hint');
  const archiveBody = document.getElementById('archive-body');
  const tallyCount = document.getElementById('tally-count');
  const todayStrip = document.getElementById('today-strip');
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewer-img');
  const viewerDate = document.getElementById('viewer-date');
  const viewerTime = document.getElementById('viewer-time');
  const viewerClose = document.getElementById('viewer-close');
  const viewerDelete = document.getElementById('viewer-delete');

  // ---- Storage: IndexedDB (works in a standalone/hosted file, fully offline) ----
  const DB_NAME = 'tally-db';
  const STORE = 'logs';

  function openDb(){
    return new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB not supported')); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)){
          db.createObjectStore(STORE, { keyPath: 'ts' });
        }
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }

  async function dbGetAll(){
    const db = await openDb();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = ()=> resolve(req.result || []);
      req.onerror = ()=> reject(req.error);
    });
  }

  async function dbPut(entry){
    const db = await openDb();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(entry);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }

  async function dbDelete(ts){
    const db = await openDb();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(ts);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }

  let entries = []; // {ts, dataUrl}
  let activeTs = null;

  function fmtDay(d){
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const y = new Date(today); y.setDate(today.getDate()-1);
    const isYesterday = d.toDateString() === y.toDateString();
    if(isToday) return 'Today';
    if(isYesterday) return 'Yesterday';
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year: d.getFullYear()!==today.getFullYear() ? 'numeric' : undefined});
  }
  function fmtTime(d){
    return d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  }

  async function loadAll(){
    try{
      const rows = await dbGetAll();
      entries = rows.sort((a,b)=> b.ts - a.ts);
      render();
    }catch(e){
      archiveBody.innerHTML = '<div class="empty">Couldn\'t load the archive on this device/browser.</div>';
    }
  }

  function render(){
    tallyCount.textContent = entries.length;

    const today = new Date();
    const todayCount = entries.filter(e=> new Date(e.ts).toDateString() === today.toDateString()).length;
    todayStrip.textContent = todayCount > 0 ? todayCount + ' today' : 'None yet today';

    if(entries.length === 0){
      archiveBody.innerHTML = '<div class="empty">Nothing logged yet.<br>Tap the shutter above to start.</div>';
      return;
    }

    const groups = {};
    const order = [];
    entries.forEach(e=>{
      const d = new Date(e.ts);
      const dayKey = d.toDateString();
      if(!groups[dayKey]){ groups[dayKey]=[]; order.push(dayKey); }
      groups[dayKey].push(e);
    });

    archiveBody.innerHTML = order.map(dayKey=>{
      const list = groups[dayKey];
      const d = new Date(list[0].ts);
      const cells = list.map(e=>{
        const t = new Date(e.ts);
        return `<div class="thumb" data-ts="${e.ts}">
          <img src="${e.dataUrl}" loading="lazy">
          <time>${fmtTime(t)}</time>
        </div>`;
      }).join('');
      return `<div class="day-group">
        <p class="day-label"><span>${fmtDay(d)}</span><span class="count">${list.length}</span></p>
        <div class="grid">${cells}</div>
      </div>`;
    }).join('');

    archiveBody.querySelectorAll('.thumb').forEach(el=>{
      el.addEventListener('click', ()=> openViewer(Number(el.getAttribute('data-ts'))));
    });
  }

  function openViewer(ts){
    const e = entries.find(x=>x.ts===ts);
    if(!e) return;
    activeTs = ts;
    viewerImg.src = e.dataUrl;
    const d = new Date(e.ts);
    viewerDate.textContent = fmtDay(d);
    viewerTime.textContent = fmtTime(d);
    viewer.classList.add('open');
  }
  function closeViewer(){
    viewer.classList.remove('open');
    activeTs = null;
  }
  viewerClose.addEventListener('click', closeViewer);
  viewer.addEventListener('click', (e)=>{ if(e.target===viewer) closeViewer(); });

  viewerDelete.addEventListener('click', async ()=>{
    if(activeTs===null) return;
    try{
      await dbDelete(activeTs);
      entries = entries.filter(e=>e.ts!==activeTs);
      closeViewer();
      render();
    }catch(e){
      alert('Could not delete — try again.');
    }
  });

  // ---- Capture flow ----
  let pendingDataUrl = null;

  function showCameraError(msg){
    cameraError.textContent = msg;
    cameraError.style.display = 'flex';
  }

  function resizeImage(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1400;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          }else{
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        resizeCanvas.width = width;
        resizeCanvas.height = height;
        const ctx = resizeCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(resizeCanvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = ()=> resolve(dataUrl); // fall back to original if resize fails
      img.src = dataUrl;
    });
  }

  cameraInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async function(evt){
      const raw = evt.target.result;
      const resized = await resizeImage(raw);
      pendingDataUrl = resized;
      capturedPreview.src = pendingDataUrl;
      cameraFrame.classList.add('has-photo');
      liveControls.style.display = 'none';
      reviewControls.style.display = 'flex';
      shutterHint.textContent = 'Upload it, or trash it and retake';
    };
    reader.onerror = function(){
      alert('Could not read that photo — try again.');
    };
    reader.readAsDataURL(file);
    cameraInput.value = '';
  });

  function backToLive(){
    pendingDataUrl = null;
    cameraFrame.classList.remove('has-photo');
    capturedPreview.src = '';
    reviewControls.style.display = 'none';
    liveControls.style.display = 'flex';
    shutterHint.textContent = 'Tap to open the camera';
  }

  trashBtn.addEventListener('click', backToLive);

  saveBtn.addEventListener('click', async ()=>{
    if(!pendingDataUrl) return;
    const dataUrl = pendingDataUrl;
    const ts = Date.now();
    saveBtn.disabled = true;
    try{
      await dbPut({ ts, dataUrl });
      entries.unshift({ ts, dataUrl });
      render();
      backToLive();
    }catch(err){
      alert('Could not save that entry — your browser may be blocking storage for local files. Try hosting the page (see Netlify/GitHub Pages) instead of opening it directly.');
    }finally{
      saveBtn.disabled = false;
    }
  });

  loadAll();
})();
</script>
</body>
</html>
