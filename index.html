<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Tally</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0d0d0d;
    --panel:#1c1c1c;
    --paper:#f5f5f5;
    --accent:#f5f5f5;
    --accent-dim:#c4c4c4;
    --muted:#8a8a8a;
    --line:#333333;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#000;
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    position:fixed;
    inset:0;
  }

  /* ---- Camera stage (full-screen background) ---- */
  #camera-stage{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }
  #video, #captured-preview{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  #captured-preview{ display:none; }
  #video.mirror{ transform:scaleX(-1); }

  .camera-error{
    display:none;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    font-size:14px;
    line-height:1.6;
    color:var(--paper);
    background:var(--panel);
    z-index:5;
  }

  /* ---- Top bar overlay ---- */
  .top-bar{
    position:fixed;
    top:0; left:0; right:0;
    padding:calc(env(safe-area-inset-top, 16px) + 10px) 16px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    pointer-events:none;
  }
  .top-bar > *{ pointer-events:auto; }
  .tally-chip{
    background:rgba(10,10,10,0.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    border:1px solid rgba(255,255,255,0.1);
  }
  .tally-chip b{ font-weight:700; }
  .top-actions{ display:flex; gap:10px; }
  .icon-btn{
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(10,10,10,0.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn:active{ transform:scale(0.92); }

  /* ---- Bottom controls ---- */
  .bottom-controls{
    position:fixed;
    left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom, 20px) + 26px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
  }
  .shutter-btn{
    width:78px;
    height:78px;
    border-radius:50%;
    background:var(--accent);
    border:4px solid #000;
    outline:2px solid var(--accent-dim);
    outline-offset:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .shutter-btn:active{
    transform:scale(0.92);
    background:var(--accent-dim);
  }
  .shutter-btn svg{ width:30px; height:30px; }
  .shutter-hint{
    position:fixed;
    left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom, 20px) + 112px);
    text-align:center;
    font-size:12px;
    color:rgba(245,245,245,0.75);
    z-index:10;
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
  }

  .review-controls{
    position:fixed;
    left:0; right:0;
    bottom:calc(env(safe-area-inset-bottom, 20px) + 30px);
    display:none;
    justify-content:center;
    gap:16px;
    z-index:10;
  }
  .review-btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:15px 30px;
    border-radius:26px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(10,10,10,0.5);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:var(--paper);
    cursor:pointer;
  }
  .review-btn.save{
    background:var(--accent);
    border-color:var(--accent);
    color:#0d0d0d;
  }
  .review-btn.trash{
    color:#f5f5f5;
    border-color:rgba(255,255,255,0.25);
  }

  /* ---- Archive drawer ---- */
  .archive-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:30;
    transform:translateY(100%);
    transition:transform 0.32s cubic-bezier(.32,.72,0,1);
    display:flex;
    flex-direction:column;
  }
  .archive-overlay.open{ transform:translateY(0); }
  .archive-header{
    padding:calc(env(safe-area-inset-top, 16px) + 14px) 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-shrink:0;
  }
  .archive-header-text .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }
  .archive-header-text .tally-count{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:52px;
    line-height:0.85;
    color:var(--paper);
    font-variant-numeric:tabular-nums;
  }
  .archive-header-text .today-strip{
    margin-top:8px;
    font-size:13px;
    color:var(--paper);
    font-weight:500;
  }

  .archive-body-scroll{
    flex:1;
    overflow-y:auto;
    padding:20px 16px calc(env(safe-area-inset-bottom, 20px) + 40px);
    -webkit-overflow-scrolling:touch;
  }
  .day-group{ margin-bottom:22px; }
  .day-label{
    font-size:13px;
    color:var(--paper);
    font-weight:600;
    margin:0 4px 8px;
    display:flex;
    justify-content:space-between;
  }
  .day-label .count{ color:var(--muted); font-weight:400; }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
  }
  .thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:6px;
    overflow:hidden;
    background:var(--panel);
    cursor:pointer;
  }
  .thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .thumb time{
    position:absolute;
    bottom:0; left:0; right:0;
    font-size:10px;
    color:var(--paper);
    background:linear-gradient(transparent, rgba(0,0,0,0.65));
    padding:10px 6px 4px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  .loading{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px;
  }

  /* ---- Photo viewer ---- */
  .viewer{
    position:fixed; inset:0;
    background:rgba(5,5,5,0.97);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:50;
    padding:20px;
  }
  .viewer.open{ display:flex; }
  .viewer img{
    max-width:100%;
    max-height:70vh;
    border-radius:8px;
    object-fit:contain;
  }
  .viewer-meta{
    margin-top:16px;
    color:var(--paper);
    font-size:14px;
    text-align:center;
  }
  .viewer-meta .sub{ color:var(--muted); font-size:12px; margin-top:2px;}
  .viewer-actions{
    margin-top:20px;
    display:flex;
    gap:12px;
  }
  .viewer-actions button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:10px 18px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
  }
  .viewer-actions button.danger{
    color:#f5f5f5;
    border-color:#4a4a4a;
  }
</style>
</head>
<body>

  <div id="camera-stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="captured-preview" alt="Captured photo">
    <canvas id="capture-canvas" style="display:none;"></canvas>
    <div class="camera-error" id="camera-error"></div>
  </div>

  <div class="top-bar">
    <div class="tally-chip"><b id="tally-count">0</b> logged</div>
    <div class="top-actions">
      <button class="icon-btn" id="flip-btn" aria-label="Flip camera">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 2L21 6L17 10" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12V10C3 7.79086 4.79086 6 7 6H21" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 22L3 18L7 14" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12V14C21 16.2091 19.2091 18 17 18H3" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-btn" id="archive-open-btn" aria-label="Open archive">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="6" height="6" rx="1" stroke="#f5f5f5" stroke-width="1.8"/>
          <rect x="14" y="4" width="6" height="6" rx="1" stroke="#f5f5f5" stroke-width="1.8"/>
          <rect x="4" y="14" width="6" height="6" rx="1" stroke="#f5f5f5" stroke-width="1.8"/>
          <rect x="14" y="14" width="6" height="6" rx="1" stroke="#f5f5f5" stroke-width="1.8"/>
        </svg>
      </button>
    </div>
  </div>

  <p class="shutter-hint" id="shutter-hint">Tap to log</p>

  <div class="bottom-controls" id="live-controls">
    <button class="shutter-btn" id="capture-btn" aria-label="Take photo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8C4 6.89543 4.89543 6 6 6H7.5L8.5 4.5H15.5L16.5 6H18C19.1046 6 20 6.89543 20 8V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V8Z" stroke="#0d0d0d" stroke-width="1.6"/>
        <circle cx="12" cy="12.5" r="3.4" stroke="#0d0d0d" stroke-width="1.6"/>
      </svg>
    </button>
  </div>

  <div class="review-controls" id="review-controls">
    <button class="review-btn trash" id="trash-btn">Trash</button>
    <button class="review-btn save" id="save-btn">Upload</button>
  </div>

  <div class="archive-overlay" id="archive-overlay">
    <div class="archive-header">
      <div class="archive-header-text">
        <p class="eyebrow">Archive</p>
        <div class="tally-count" id="archive-tally-count">0</div>
        <div class="today-strip" id="today-strip"></div>
      </div>
      <button class="icon-btn" id="archive-close-btn" aria-label="Close archive">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6L18 18M18 6L6 18" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="archive-body-scroll" id="archive-body">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <img id="viewer-img" src="" alt="Logged entry">
    <div class="viewer-meta">
      <div id="viewer-date"></div>
      <div class="sub" id="viewer-time"></div>
    </div>
    <div class="viewer-actions">
      <button id="viewer-close">Close</button>
      <button class="danger" id="viewer-delete">Delete</button>
    </div>
  </div>

<script>
(function(){
  const video = document.getElementById('video');
  const capturedPreview = document.getElementById('captured-preview');
  const captureCanvas = document.getElementById('capture-canvas');
  const cameraError = document.getElementById('camera-error');
  const flipBtn = document.getElementById('flip-btn');
  const captureBtn = document.getElementById('capture-btn');
  const liveControls = document.getElementById('live-controls');
  const reviewControls = document.getElementById('review-controls');
  const trashBtn = document.getElementById('trash-btn');
  const saveBtn = document.getElementById('save-btn');
  const shutterHint = document.getElementById('shutter-hint');

  const tallyCount = document.getElementById('tally-count');
  const archiveTallyCount = document.getElementById('archive-tally-count');
  const todayStrip = document.getElementById('today-strip');
  const archiveBody = document.getElementById('archive-body');
  const archiveOverlay = document.getElementById('archive-overlay');
  const archiveOpenBtn = document.getElementById('archive-open-btn');
  const archiveCloseBtn = document.getElementById('archive-close-btn');

  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewer-img');
  const viewerDate = document.getElementById('viewer-date');
  const viewerTime = document.getElementById('viewer-time');
  const viewerClose = document.getElementById('viewer-close');
  const viewerDelete = document.getElementById('viewer-delete');

  // ---- Storage: IndexedDB (works fully offline on a hosted or local page) ----
  const DB_NAME = 'tally-db';
  const STORE = 'logs';

  function openDb(){
    return new Promise((resolve, reject)=>{
      if(!window.indexedDB){ reject(new Error('IndexedDB not supported')); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)){
          db.createObjectStore(STORE, { keyPath: 'ts' });
        }
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function dbGetAll(){
    const db = await openDb();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = ()=> resolve(req.result || []);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function dbPut(entry){
    const db = await openDb();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(entry);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }
  async function dbDelete(ts){
    const db = await openDb();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(ts);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }

  let entries = []; // {ts, dataUrl}
  let activeTs = null;

  function fmtDay(d){
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const y = new Date(today); y.setDate(today.getDate()-1);
    const isYesterday = d.toDateString() === y.toDateString();
    if(isToday) return 'Today';
    if(isYesterday) return 'Yesterday';
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year: d.getFullYear()!==today.getFullYear() ? 'numeric' : undefined});
  }
  function fmtTime(d){
    return d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
  }

  async function loadAll(){
    try{
      const rows = await dbGetAll();
      entries = rows.sort((a,b)=> b.ts - a.ts);
      render();
    }catch(e){
      archiveBody.innerHTML = '<div class="empty">Couldn\'t load the archive on this device/browser.</div>';
    }
  }

  function render(){
    tallyCount.textContent = entries.length;
    archiveTallyCount.textContent = entries.length;

    const today = new Date();
    const todayCount = entries.filter(e=> new Date(e.ts).toDateString() === today.toDateString()).length;
    todayStrip.textContent = todayCount > 0 ? todayCount + ' today' : 'None yet today';

    if(entries.length === 0){
      archiveBody.innerHTML = '<div class="empty">Nothing logged yet.<br>Tap the shutter to start.</div>';
      return;
    }

    const groups = {};
    const order = [];
    entries.forEach(e=>{
      const d = new Date(e.ts);
      const dayKey = d.toDateString();
      if(!groups[dayKey]){ groups[dayKey]=[]; order.push(dayKey); }
      groups[dayKey].push(e);
    });

    archiveBody.innerHTML = order.map(dayKey=>{
      const list = groups[dayKey];
      const d = new Date(list[0].ts);
      const cells = list.map(e=>{
        const t = new Date(e.ts);
        return `<div class="thumb" data-ts="${e.ts}">
          <img src="${e.dataUrl}" loading="lazy">
          <time>${fmtTime(t)}</time>
        </div>`;
      }).join('');
      return `<div class="day-group">
        <p class="day-label"><span>${fmtDay(d)}</span><span class="count">${list.length}</span></p>
        <div class="grid">${cells}</div>
      </div>`;
    }).join('');

    archiveBody.querySelectorAll('.thumb').forEach(el=>{
      el.addEventListener('click', ()=> openViewer(Number(el.getAttribute('data-ts'))));
    });
  }

  function openViewer(ts){
    const e = entries.find(x=>x.ts===ts);
    if(!e) return;
    activeTs = ts;
    viewerImg.src = e.dataUrl;
    const d = new Date(e.ts);
    viewerDate.textContent = fmtDay(d);
    viewerTime.textContent = fmtTime(d);
    viewer.classList.add('open');
  }
  function closeViewer(){
    viewer.classList.remove('open');
    activeTs = null;
  }
  viewerClose.addEventListener('click', closeViewer);
  viewer.addEventListener('click', (e)=>{ if(e.target===viewer) closeViewer(); });

  viewerDelete.addEventListener('click', async ()=>{
    if(activeTs===null) return;
    try{
      await dbDelete(activeTs);
      entries = entries.filter(e=>e.ts!==activeTs);
      closeViewer();
      render();
    }catch(e){
      alert('Could not delete — try again.');
    }
  });

  // ---- Archive drawer open/close ----
  archiveOpenBtn.addEventListener('click', ()=> archiveOverlay.classList.add('open'));
  archiveCloseBtn.addEventListener('click', ()=> archiveOverlay.classList.remove('open'));

  // ---- Live camera (getUserMedia) ----
  let currentStream = null;
  let facingMode = 'environment';

  async function startCamera(){
    stopCamera();
    cameraError.style.display = 'none';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showCameraError('This browser doesn\'t support in-page camera access.');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal: facingMode } },
        audio:false
      });
      currentStream = stream;
      video.srcObject = stream;
      video.classList.toggle('mirror', facingMode === 'user');
    }catch(err){
      showCameraError('Camera access was blocked. Allow camera access for this site in your browser settings, then reload.');
    }
  }

  function stopCamera(){
    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
      currentStream = null;
    }
  }

  function showCameraError(msg){
    cameraError.textContent = msg;
    cameraError.style.display = 'flex';
  }

  flipBtn.addEventListener('click', ()=>{
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ---- Capture flow ----
  let pendingDataUrl = null;

  captureBtn.addEventListener('click', ()=>{
    if(!video.videoWidth){ return; }
    const maxDim = 1600;
    let w = video.videoWidth, h = video.videoHeight;
    if(w > maxDim || h > maxDim){
      if(w > h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
      else{ w = Math.round(w * (maxDim / h)); h = maxDim; }
    }
    captureCanvas.width = w;
    captureCanvas.height = h;
    const ctx = captureCanvas.getContext('2d');
    if(facingMode === 'user'){
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, w, h);
    pendingDataUrl = captureCanvas.toDataURL('image/jpeg', 0.85);

    capturedPreview.src = pendingDataUrl;
    capturedPreview.style.display = 'block';
    video.style.display = 'none';
    liveControls.style.display = 'none';
    shutterHint.style.display = 'none';
    flipBtn.style.display = 'none';
    reviewControls.style.display = 'flex';
  });

  function backToLive(){
    pendingDataUrl = null;
    capturedPreview.style.display = 'none';
    capturedPreview.src = '';
    video.style.display = 'block';
    reviewControls.style.display = 'none';
    liveControls.style.display = 'flex';
    shutterHint.style.display = 'block';
    flipBtn.style.display = 'flex';
  }

  trashBtn.addEventListener('click', backToLive);

  saveBtn.addEventListener('click', async ()=>{
    if(!pendingDataUrl) return;
    const dataUrl = pendingDataUrl;
    const ts = Date.now();
    saveBtn.disabled = true;
    try{
      await dbPut({ ts, dataUrl });
      entries.unshift({ ts, dataUrl });
      render();
      backToLive();
    }catch(err){
      alert('Could not save that entry — try again.');
    }finally{
      saveBtn.disabled = false;
    }
  });

  startCamera();
  loadAll();
})();
</script>
</body>
</html>
